# Tests and builds every pull request to main and every push to main: the unit tests, the 2D game,
# and the 3D build with its artifact version. A push to main also deploys to GitHub Pages once you
# turn it on:
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions
#   2. Settings > Secrets and variables > Actions > Variables: add PAGES_ENABLED = true
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 3D build
        run: npm run build:3d
      - name: 3D artifact build
        run: npm run build:3d-artifact
      # Pull requests are checked, never deployed.
      - if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
